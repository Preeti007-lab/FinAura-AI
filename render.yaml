services:
  - type: web
    name: finaura-ai-wealthtech
    env: node
    buildCommand: npm run postinstall && npm run build
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: GROQ_API_KEY
        sync: false
